<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Borderland</title>
<style>
:root{--ink:#111;--mut:#8a8a8a;--line:#d9d9d9;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Jost","Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.04em;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:var(--bg);border:1px solid var(--ink);padding:12px 18px;cursor:pointer;border-radius:0}
button:active,button.on{background:var(--ink);color:var(--bg)}
button.ghost{border-color:var(--line)}
button:disabled{opacity:.3}
input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 0;border-radius:0;outline:0}
textarea{border:1px solid var(--ink);padding:10px;resize:none}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 0}
h1,h2{font-weight:300;margin:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:8px}
.dot.ok{background:var(--ink)}
#lobby{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px}
#lobby .t1{font-size:26px;line-height:1.7}
#lobby .t2{font-size:44px;margin:18px 0 8px;letter-spacing:.06em;font-weight:400}
#lobby form,#lobby .box{width:100%;max-width:340px;text-align:left;margin-top:26px}
#lobby .or{text-align:center;color:var(--mut);margin:26px 0 0;font-size:13px}
#lobby button.full{width:100%;margin-top:22px}
#code{text-transform:uppercase;text-align:center;font-size:28px;letter-spacing:.5em}
#err{color:var(--ink);min-height:20px;font-size:14px;margin-top:12px;text-align:center}
#game{height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
header b{font-weight:400;letter-spacing:.3em}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:18px}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;border:0;padding:14px 2px;font-size:14px}
nav button.on{background:var(--ink);color:var(--bg)}
.card{border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:14px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff center/cover;flex:none;overflow:hidden;font-weight:400}
.card .info{flex:1;min-width:0}
.card .nm{font-size:16px;cursor:pointer}
.bar{display:flex;gap:3px;margin-top:6px;align-items:center;font-size:12px;color:var(--mut)}
.bar i{width:14px;height:6px;border:1px solid var(--ink)}
.bar i.f{background:var(--ink)}
.bar span{width:34px}
.qc{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.qc button{padding:4px 9px;font-size:12px;border-color:var(--line)}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.rowx{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.warn{font-size:12px;color:var(--mut);margin:8px 0 0}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--ink);z-index:30;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 40px;transform:translateX(100%);transition:transform .2s}
#drawer.open{transform:none}
#sheetbg{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--ink);padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .2s;max-height:60dvh;overflow:auto}
#sheetbg.open{transform:none}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#f6f6f6;cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 0 0 1px var(--ink)}
#stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
#grid{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);text-align:center;touch-action:none}
.tok .av{margin:auto;border-width:2px}
.tok small{display:block;margin-top:2px;font-size:11px;background:#fff;border:1px solid var(--ink);padding:0 4px;white-space:nowrap}
.tok.off{opacity:.45}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:22px;line-height:1;cursor:pointer}
#rl{position:absolute;pointer-events:none;inset:0;width:100%;height:100%}

.fab{position:absolute;right:12px;display:flex;flex-direction:column;gap:6px;top:12px;z-index:5}
.fab button{width:44px;height:44px;padding:0;font-size:18px}
.big{text-align:center;padding:26px 0;border-bottom:1px solid var(--ink)}
.big .n{font-size:64px;font-weight:300;line-height:1}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.chips button{padding:12px 0}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.dgrid button{padding:12px 0}
.log div{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.rnd{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
/* ---- overlay do evento (tela GAME) ---- */
#ev{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;color:var(--ink)}
#ev .bk{height:9vh;min-height:44px;background:#000;flex:none}
#ev .mid{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px}
#ev .jp{font-size:22px;line-height:1.9;letter-spacing:.08em}
#ev .ttl{font-size:40px;margin:14px 0;font-weight:400;letter-spacing:.05em;line-height:1.3}
#ev .sm{font-size:15px;color:var(--mut);margin:6px 0}
#ev .num{font-size:72px;font-weight:300;line-height:1;margin:14px 0 6px}
#ev button{margin-top:22px;padding:18px 40px;font-size:18px}
#ev .rl{width:100%;max-width:340px;display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.rl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;width:100%}
.red{color:#c00;font-weight:400}
.av.npc{border-color:#c00;border-width:2px}
.tok.npc .av{border-color:#c00}
#ev .rl{max-width:340px}
.pin small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;background:#fff;border:1px solid var(--ink);padding:0 5px;font-size:11px;white-space:nowrap;pointer-events:none}
#rt{position:absolute;background:#111;color:#fff;padding:3px 8px;font-size:13px;pointer-events:none;transform:translate(-50%,-130%);white-space:nowrap}
#prof{padding:28px 22px;overflow:auto}
.chip{display:inline-block;border:1px solid var(--ink);padding:3px 8px;font-size:12px;margin:2px}
</style>
</head>
<body>

<section id="lobby">
  <div class="t1">ようこそ<br>プレイヤー</div>
  <div class="t2">【GAME】</div>
  <div style="font-size:13px;color:var(--mut)"><span class="dot" id="cdot"></span><span id="ctxt">conectando…</span></div>
  <div class="box"><button class="full" id="bCreate">Criar nova sala</button><button class="full ghost" id="bImpMesa">Importar mesa (.json)</button><button class="full ghost" id="bPerfis">Meus personagens</button></div><input type="file" id="fMesa" accept=".json,application/json" hidden>
  <div class="or">ou entre em uma sala</div>
  <form id="fJoin">
    <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
    <label>Nome<input id="jname" maxlength="30" autocomplete="off"></label>
    <label>Perfil salvo<select id="jprof"></select></label>
    <button class="full" type="submit">Entrar</button>
  </form>
  <div id="err"></div>
</section>

<section id="prof" hidden>
  <div id="pl-view">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Personagens</h2><button class="ghost" id="pBack">Voltar</button></div>
    <div style="max-width:420px;margin:18px auto 0"><button class="full" id="pNew" style="width:100%">Novo personagem</button><button class="full ghost" id="pImp" style="width:100%;margin-top:10px">Importar ficha (.json)</button></div>
    <div id="plist" style="max-width:420px;margin:18px auto 0"></div>
  </div>
  <div id="pe-view" hidden style="max-width:420px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="pTitle">Ficha</h2><button class="ghost" id="pList">Voltar</button></div>
    <div id="pedit" style="margin-top:12px"></div>
    <div style="display:flex;gap:8px;margin-top:18px"><button id="pSave" style="flex:1">Salvar</button><button class="ghost" id="pExp" style="flex:1">Exportar (.json)</button></div>
    <button class="ghost" id="pDel" style="width:100%;margin-top:10px">Excluir personagem</button>
    <p class="warn" id="pMsg"></p>
  </div>
  <input type="file" id="fFicha" accept=".json,application/json" hidden>
</section>
<section id="game" hidden>
  <header><span><span class="dot" id="gdot"></span><b id="gcode"></b></span><span><span id="role"></span> <button id="bLeave" class="ghost" style="padding:6px 10px;font-size:12px">Sair</button></span></header>
  <main>
    <div class="view" id="v-mesa"></div>
    <div class="view" id="v-mapa" style="padding:0">
      <div id="vp"><div id="stage"><img id="mimg" alt=""><div id="grid"></div><div id="layer"></div></div>
        <svg id="rl"><line id="rhalo" stroke="#fff" stroke-width="5" x1="0" y1="0" x2="0" y2="0" style="display:none"/><line id="rline" stroke="#111" stroke-width="2" stroke-dasharray="7 5" x1="0" y1="0" x2="0" y2="0" style="display:none"/></svg><div id="rt" hidden></div>
      </div>
      <div class="fab">
        <button id="zi">+</button><button id="zo">−</button><button id="zc">◎</button>
        <button id="tr">📏</button><button id="tp" hidden>📌</button><button id="ts" hidden>⚙</button>
      </div>
    </div>
    <div class="view" id="v-evento"></div>
    <div class="view" id="v-npc"></div>
    <div class="view" id="v-ficha"></div>
    <div class="view" id="v-dados"></div>
  </main>
  <nav id="nav"></nav>
</section>

<div id="ev" hidden><div class="bk"></div><div class="mid" id="evmid"></div><div class="bk"></div></div>
<aside id="drawer"></aside>
<div id="sheetbg"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ATTR=[{k:'F',s:'♠',n:'Físico'},{k:'I',s:'♦',n:'Intelecto'},{k:'A',s:'♣',n:'Agilidade'},{k:'P',s:'♥',n:'Psicológico'}];
const DICE=[4,6,8,10,12,20,100];
const attrName=k=>{const a=ATTR.find(x=>x.k===k);return a?a.s+' '+a.n:'Sem atributo'};
const blank=()=>({name:'',spec:'',avatar:'',attrs:{F:2,I:1,A:0,P:-1},pv:6,em:6,dias:3,inv:['','','','','']});
const sg=v=>v>0?'+'+v:''+v;
const hasSpec=(sheet,rd)=>{const a=(sheet.spec||'').toLowerCase().trim(),b=(rd.spec||'').toLowerCase().trim();return !!a&&!!b&&(a.includes(b)||b.includes(a))};
let S=null,me=null,mapimg='',tab='',tool='',V={x:0,y:0,k:1},sock;
let dSides=20,dQty=1,dMod=0,rAttr='',rAdv=false,drawId=null;
let evTitle='GAME',evDraft=[];
let MYCARD=null,GMDATA=null,recvAt=0;
try{me=JSON.parse(localStorage.getItem('sess')||'null')}catch(e){}
const profs=()=>{try{return JSON.parse(localStorage.getItem('profiles')||'[]')}catch(e){return[]}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* ---------- conexão ---------- */
sock=io({transports:['websocket','polling']});
function conn(ok){['#cdot','#gdot'].forEach(s=>$(s).classList.toggle('ok',ok));$('#ctxt').textContent=ok?'servidor conectado':'sem conexão…'}
sock.on('connect',()=>{conn(true);if(me)sock.emit('rejoin',me,r=>{if(r&&r.ok){me.role=r.role;enterGame()}else{localStorage.removeItem('sess');me=null;$('#lobby').hidden=false;$('#game').hidden=true}})});
sock.on('disconnect',()=>conn(false));
sock.on('state',s=>{S=s;recvAt=Date.now();render()});
sock.on('card',c=>{MYCARD=c;if(S)render()});
sock.on('npcmove',({id,x,y})=>{const n=S&&(S.npcs||[]).find(q=>q.id===id);if(n){n.x=x;n.y=y;const t=document.querySelector(`[data-t="${id}"]`);if(t){t.style.left=x+'px';t.style.top=y+'px'}}});
sock.on('gmdata',d=>{GMDATA=d;if(S&&tab==='evento')renderEvt(true)});
sock.on('mapimg',i=>{mapimg=i||'';$('#mimg').src=mapimg;$('#mimg').hidden=!mapimg});
sock.on('move',({id,x,y})=>{const p=S&&S.players.find(p=>p.id===id);if(p){p.x=x;p.y=y;const t=document.querySelector(`[data-t="${id}"]`);if(t){t.style.left=x+'px';t.style.top=y+'px'}}});

/* ---------- lobby ---------- */
const opts=()=>{const l=profs();$('#jprof').innerHTML='<option value="">Novo personagem</option>'+l.map((p,i)=>`<option value="${i}">${esc(p.name||'Sem nome')}</option>`).join('')};opts();
$('#jprof').onchange=()=>{const p=profs()[$('#jprof').value];if(p)$('#jname').value=p.name};
$('#code').oninput=e=>e.target.value=e.target.value.toUpperCase();
const err=t=>$('#err').textContent=t||'';
$('#bCreate').onclick=()=>sock.emit('create',null,r=>{me={role:'gm',code:r.code,token:r.token};save();enterGame()});
$('#fJoin').onsubmit=e=>{e.preventDefault();err();
  const i=$('#jprof').value,sheet=i!==''?profs()[i]:blank(),name=$('#jname').value.trim()||sheet.name;
  if($('#code').value.length<4)return err('Digite o código de 4 letras');
  if(!name)return err('Digite seu nome');
  sock.emit('join',{code:$('#code').value,name,sheet},r=>{if(!r.ok)return err(r.error);me={role:'player',code:r.code,sid:r.sid};save();enterGame()})};
const save=()=>localStorage.setItem('sess',JSON.stringify(me));

function enterGame(){
  $('#lobby').hidden=true;$('#game').hidden=false;$('#gcode').textContent=me.code;
  $('#role').textContent=me.role==='gm'?'Mestre':'Jogador';
  $('#tp').hidden=$('#ts').hidden=me.role!=='gm';
  const tabs=me.role==='gm'?[['mesa','Mesa'],['mapa','Mapa'],['evento','Evento'],['npc','NPCs'],['dados','Dados']]:[['mapa','Mapa'],['ficha','Ficha'],['dados','Dados']];
  $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
  go(tabs[0][0]);
}
function go(t){tab=t;document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='mapa')setTimeout(fit,30);render()}
$('#gcode').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(me.code);

/* ---------- ficha ---------- */
function sheetForm(el,s,commit,canSave){
  if(el.contains(document.activeElement)&&el.dataset.ready)return;
  el.dataset.ready=1;
  const pm=Object.values(s.attrs).slice().sort().join()==='-1,0,1,2';
  el.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><div class="av" style="width:64px;height:64px;${s.avatar?`background-image:url(${s.avatar})`:''}">${s.avatar?'':esc((s.name||'?')[0])}</div><label style="margin:0;flex:1">Foto<input type="file" accept="image/*" data-av></label></div>
  <label>Nome<input data-k="name" value="${esc(s.name)}" maxlength="30"></label>
  <label>Especialidade (rola com vantagem)<input data-k="spec" value="${esc(s.spec)}" maxlength="40" placeholder="Medicina, Atletismo…"></label>
  <div class="attrs">${ATTR.map(a=>`<label>${a.s} ${a.n}<select data-a="${a.k}">${[2,1,0,-1].map(v=>`<option value="${v}" ${s.attrs[a.k]==v?'selected':''}>${sg(v)}</option>`).join('')}</select></label>`).join('')}</div>
  <p class="warn">${pm?'Distribuição: +2, +1, +0, −1':'Use cada valor (+2, +1, +0, −1) uma vez'}</p>
  <div class="stats"><label>PV<input type="number" data-k="pv" value="${s.pv}" disabled></label><label>Estresse<input type="number" data-k="em" value="${s.em}" disabled></label><label>Dias de visto<input type="number" data-k="dias" value="${s.dias}" disabled></label></div>
  <label>Inventário (5 espaços)</label>${[0,1,2,3,4].map(i=>`<input data-i="${i}" value="${esc(s.inv[i]||'')}" maxlength="40" placeholder="${i+1}">`).join('')}
  ${canSave?'<button class="full" style="width:100%;margin-top:24px" data-save>Salvar perfil neste aparelho</button>':''}`;
  const read=()=>{const o=JSON.parse(JSON.stringify(s));
    el.querySelectorAll('[data-k]:not([disabled])').forEach(i=>o[i.dataset.k]=i.type==='number'?+i.value||0:i.value);
    el.querySelectorAll('[data-a]').forEach(i=>o.attrs[i.dataset.a]=+i.value);
    o.inv=[...el.querySelectorAll('[data-i]')].map(i=>i.value);return o};
  el.onchange=e=>{if(e.target.dataset.av!==undefined){small(e.target.files[0],d=>{const o=read();o.avatar=d;el.dataset.ready='';commit(o)});return}el.dataset.ready='';commit(read())};
  const sv=el.querySelector('[data-save]');if(sv)sv.onclick=()=>{const o=read(),l=profs(),i=l.findIndex(p=>p.name===o.name);if(i>=0)l[i]=o;else l.push(o);localStorage.setItem('profiles',JSON.stringify(l));opts();sv.textContent='Perfil salvo'};
}
function small(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}

/* ---------- render ---------- */
const player=id=>S.players.find(p=>p.id===id);
const bar=(l,v)=>`<div class="bar"><span>${l}</span>${[1,2,3,4,5,6].map(i=>`<i class="${i<=v?'f':''}"></i>`).join('')}</div>`;
function render(){
  if(!S||!me)return;
  if(tab==='mesa')renderMesa();
  if(tab==='evento')renderEvt();
  if(tab==='npc')renderNpc();
  if(tab==='ficha'){const p=player(me.sid);if(p){sheetForm($('#v-ficha'),p.sheet,s=>sock.emit('sheet',s),true);gearView($('#v-ficha'),p)}}
  if(tab==='dados')renderDice();
  if(drawId&&player(drawId)&&$('#drawer').classList.contains('open'))gearEd($('#dr-gear'),drawId);
  if(drawId&&player(drawId)&&$('#drawer').classList.contains('open')&&!$('#dr-cond').contains(document.activeElement))$('#dr-cond').innerHTML=condBlock(player(drawId).sheet.conds,'pl',drawId,true);
  if(mapsOpen){const sb=$('#sheetbg');if(!sb.classList.contains('open'))mapsOpen=false;else if(!sb.contains(document.activeElement))openMaps()}
  if(condId){const sb=$('#sheetbg'),pl=player(condId);if(!pl||!sb.classList.contains('open')){condId=null}else if(!sb.contains(document.activeElement))sb.innerHTML=condSheet(pl)}
  renderMap();
  renderOverlay();
  if(drawId&&player(drawId)&&$('#drawer').classList.contains('open'))sheetForm($('#dr-body'),player(drawId).sheet,s=>sock.emit('gm:sheet',{id:drawId,sheet:s}));
}
function renderMesa(){
  const el=$('#v-mesa');if(el.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;
  el.innerHTML=`<button class="ghost" id="bExp" style="width:100%;margin-bottom:12px">Salvar / exportar mesa (.json)</button><p style="color:var(--mut);font-size:13px;margin:0 0 6px">${S.players.length}/12 jogadores · código <b style="font-weight:400">${S.code}</b></p>`+
  (S.players.length?S.players.map(p=>`<div class="card"><div class="av" data-o="${p.id}" style="${p.sheet.avatar?`background-image:url(${p.sheet.avatar})`:''}">${p.sheet.avatar?'':esc((p.sheet.name||'?')[0])}</div>
    <div class="info"><div class="nm" data-o="${p.id}"><span class="dot ${p.online?'ok':''}"></span>${esc(p.sheet.name)}</div>${bar('PV',p.sheet.pv)}${bar('EM',p.sheet.em)}
    <div class="bar"><span>Dias</span>${p.sheet.dias}</div>

/* ---------- evento: painel do Mestre ---------- */
const RULE_LABEL={none:'Nenhuma',par:'Só vale rolar par',impar:'Só vale rolar ímpar',ultimo:'Quem rolar por último sofre +1 de dano',dobro:'Dano dobrado'};
const SUIT_OF={F:'♠',I:'♦',A:'♣',P:'♥'};
function renderEvt(force){
  const el=$('#v-evento');
  if(!force&&el.contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(S.event)return evPanel(el);
  const pr=getPresets();
  el.innerHTML=`<label>Título do evento<input id="evT" maxlength="40" value="${esc(evTitle)}"></label>
  <label>Naipe da arena (tema)<select id="evS"><option value="">Nenhum</option>${['♠','♦','♣','♥'].map(s=>`<option value="${s}" ${evSuit===s?'selected':''}>${s} ${SUIT_LBL[s]}</option>`).join('')}</select></label>
  <p class="warn">${evSuit?esc('Arena de '+SUIT_LBL[evSuit]+': '+ARENA_TXT[evSuit]):'Sem efeito de naipe.'}</p>
  ${evDraft.map((r,i)=>roundRow(r,i)).join('')}
  <div style="display:flex;gap:8px;margin-top:18px"><button class="ghost" data-add style="flex:1">+ Rodada</button><button class="ghost" data-ex style="flex:1">Exemplo</button></div>
  <button class="full" data-go style="width:100%;margin-top:16px;padding:16px">Iniciar evento</button>
  <button class="ghost" data-save style="width:100%;margin-top:8px">Salvar como preset</button>
  <p class="warn" id="evErr"></p>
  <div class="rnd"><div class="sm">Eventos salvos (neste aparelho)</div>${pr.length?pr.map((p,i)=>`<div class="rl"><span>${esc(p.name)}<br><span class="sm">${p.rounds.length} rodadas${p.suit?' · '+p.suit:''}</span></span><span style="white-space:nowrap"><button data-fire="${i}">Disparar</button> <button class="ghost" data-load="${i}">Editar</button> <button class="ghost" data-pdel="${i}">×</button></span></div>`).join(''):'<p class="sm">Nenhum preset salvo</p>'}</div>`;
  el.oninput=setF;
  el.onchange=setF;
  el.onclick=ev=>{const t=ev.target,d=t.dataset;
    if(d.rm!==undefined){evDraft.splice(+d.rm,1);return renderEvt(true)}
    if(d.add!==undefined){evDraft.push({name:'Nova rodada',kind:'teste',attr:'F',dc:7,dano:2,spec:'',timer:60,rule:'none'});return renderEvt(true)}
    if(d.ex!==undefined){evDraft=exemplo();evTitle='GAME';return renderEvt(true)}
    if(d.go!==undefined)return startEv(evTitle,evSuit,evDraft);
    if(d.save!==undefined){const nm=prompt('Nome do preset');if(!nm||!nm.trim())return;const l=getPresets();l.push({id:Date.now().toString(36),name:nm.trim().slice(0,40),title:evTitle,suit:evSuit,rounds:JSON.parse(JSON.stringify(evDraft))});setPresets(l);return renderEvt(true)}
    if(d.fire!==undefined){const p=getPresets()[+d.fire];if(p)return startEv(p.title,p.suit,p.rounds)}
    if(d.load!==undefined){const p=getPresets()[+d.load];if(p){evTitle=p.title;evSuit=p.suit||'';evDraft=JSON.parse(JSON.stringify(p.rounds));renderEvt(true)}return}
    if(d.pdel!==undefined){if(confirm('Excluir este preset?')){const l=getPresets();l.splice(+d.pdel,1);setPresets(l);renderEvt(true)}}
  };
}
const SUIT_LBL={'♠':'Espadas','♦':'Ouros','♣':'Paus','♥':'Copas'};

const KIND_LBL={teste:'Teste (CD)',combate:'Combate (placar de dano)',enigma:'Enigma (resposta com vidas)'};
let evSuit='';
const getPresets=()=>{try{return JSON.parse(localStorage.getItem('presets')||'[]')}catch(e){return[]}};
const setPresets=l=>localStorage.setItem('presets',JSON.stringify(l));
const exemplo=()=>[

function setF(e){
  const t=e.target,d=t.dataset;
  if(t.id==='evT'){evTitle=t.value;return}
  if(t.id==='evS'){evSuit=t.value;return renderEvt(true)}
  if(d.f===undefined)return;
  const r=evDraft[+d.i];if(!r)return;
  if(d.f==='kind'){r.kind=t.value;return renderEvt(true)}
  if(d.f==='ci'){r.ci=t.value==='1';return}
  r[d.f]=['dc','dano','timer','lives'].includes(d.f)?+t.value:t.value;

function startEv(title,suit,rounds){
  if(!rounds||!rounds.length){const x=$('#evErr');if(x)x.textContent='Adicione ao menos uma rodada';return}

function evPanel(el){

    else if(e.phase==='result'&&e.results&&e.results[id])st=(e.results[id].pass?'passou':'falhou')+(e.results[id].dmg?' −'+e.results[id].dmg:'');
    return `<div><span>${esc(p.sheet.name)} ${c?c.suit:''}${c&&c.joker?' 🃏':''}</span><span>${alive?'PV '+p.sheet.pv:'脱落'}${st?' · '+st:''}</span></div>`}).join('')}</div>

    <p class="sm">Regra: ${esc(ruleTxt)}</p>

    if(!member)h+=`<p class="sm">観戦中 · Você está assistindo</p>`;
    else if(!alive)h+=`<div class="num" style="font-size:44px">脱落</div><p class="sm">Você foi eliminado</p>`;
    else if(e.rolls[pid]){const r=e.rolls[pid];h+=`<div class="num">${r.total}</div><p class="sm">${r.dice.join(' + ')}${r.v?' '+sg(r.v):''}</p><p class="sm">Aguardando os outros · ${Object.keys(e.rolls).length}/${e.members.filter(i=>player(i)&&player(i).sheet.pv>0).length}</p>`}
    else{

// Contagem regressiva (o servidor manda o tempo restante; o cliente desconta o que passou)
function tick(){
  if(!S||!S.event||S.event.left==null)return;
  const ms=Math.max(0,S.event.left-(Date.now()-recvAt));
  const t=ms>=10000?Math.ceil(ms/1000)+'s':(ms/1000).toFixed(1)+'s';
  document.querySelectorAll('[data-tmr]').forEach(x=>x.textContent=t);
}
setInterval(tick,250);

function download(name,obj){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function readJSON(f,cb){
  if(!f)return cb(null);
  const r=new FileReader();
  r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){cb(null)}};
  r.readAsText(f);
}
function exportMesa(){

}

function drawRuler(){
  const l=$('#rline'),h=$('#rhalo'),t=$('#rt');
  if(!ruler||tool!=='ruler'||!S){l.style.display=h.style.display='none';t.hidden=true;return}
  const a=ruler.a,b=ruler.b,X=p=>p.x*V.k+V.x,Y=p=>p.y*V.k+V.y;
  [l,h].forEach(el=>{el.style.display='';el.setAttribute('x1',X(a));el.setAttribute('y1',Y(a));el.setAttribute('x2',X(b));el.setAttribute('y2',Y(b))});
  const px=Math.hypot(b.x-a.x,b.y-a.y),sq=px/S.map.cell;
  t.hidden=false;

}

// Conta transparente: [4, 5] + 2 (Físico) − 2 (Exaustão Extrema) = 9
function formula(l){
  if(!l.parts)return '';
  const d=`[${(l.dice||[]).join(', ')}]`;
  const ps=l.parts.map(p=>` ${p.v<0?'−':'+'} ${Math.abs(p.v)} (${esc(p.l)})`).join('');
  return `${d}${ps} = ${l.total}`;
}
function bigOf(l){
  const head=`<div style="font-size:13px;color:var(--mut)">${esc(l.who)}${l.type==='free'?` · ${l.count}d${l.sides}`:''}${l.type==='event'?' · evento':''}${l.adv?' · vantagem':''}</div>`;
  if(l.type==='free')return head+`<div class="n">${l.total}</div><div>${l.dice.join(' + ')}${l.mod?' '+sg(l.mod):''}</div>`;
  if(l.type==='enigma')return head+`<div class="n" style="font-size:40px">${esc(l.res)}</div><div class="sm">vidas restantes: ${l.vidas}</div>`;
  const f=formula(l);
  const res=l.res?`<div style="margin-top:8px;font-size:18px;letter-spacing:.15em">${esc(l.res)}</div>`:'';
  return head+`<div class="n">${l.total}</div>${f?`<div style="font-size:14px;margin-top:6px">${f}</div>`:`<div>${(l.dice||[]).join(' + ')}</div>`}${res}`;
}
function logRow(l){
  if(l.type==='free')return [`${esc(l.who)} · ${l.count}d${l.sides}${l.mod?sg(l.mod):''}`,l.total];
  if(l.type==='enigma')return [`${esc(l.who)} · enigma`,`${esc(l.res)} · vidas ${l.vidas}`];
  if(l.type==='npc')return [`${esc(l.who)} · NPC`,`${formula(l)||l.total} · ${esc(l.res)}`];
  const sym=l.attr?ATTR.find(x=>x.k===l.attr).s:'';

const wpos=e=>{const r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
vp.addEventListener('pointerdown',e=>{
  const tk=e.target.closest('.tok');
  if(tk&&me.role==='gm'&&!tool){dragTok=tk;tk.setPointerCapture(e.pointerId);e.stopPropagation();return}
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:V.k};pan=null;tap=null;return}
  if(tool==='ruler'){const w=wpos(e);ruler={a:w,b:w}}
  else{pan={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y};tap={x:e.clientX,y:e.clientY,pin:e.target.closest('.pin')}}
});
vp.addEventListener('pointermove',e=>{
  if(dragTok){const w=wpos(e);dragTok.style.left=w.x+'px';dragTok.style.top=w.y+'px';const id=dragTok.dataset.t;
    const now=Date.now();if(now-(dragTok.ls||0)>50){dragTok.ls=now;sock.emit(dragTok.dataset.npc?'gm:npc:move':'gm:move',{id,x:w.x,y:w.y})}return}
  if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&P.size>=2){const[a,b]=[...P.values()],r=vp.getBoundingClientRect(),d=Math.hypot(a.x-b.x,a.y-b.y);
    const k=Math.max(.1,Math.min(5,pinch.k*d/pinch.d)),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;V.x=cx-(cx-V.x)*k/V.k;V.y=cy-(cy-V.y)*k/V.k;V.k=k;apply();return}
  if(ruler){ruler.b=wpos(e);drawRuler();return}
  if(pan){V.x=pan.vx+e.clientX-pan.x;V.y=pan.vy+e.clientY-pan.y;apply();if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>6)tap=null}
});
const up=e=>{
  if(dragTok){const w=wpos(e),id=dragTok.dataset.t;sock.emit(dragTok.dataset.npc?'gm:npc:move':'gm:move',{id,x:w.x,y:w.y});const p=player(id);if(p){p.x=w.x;p.y=w.y}dragTok=null;mapSig='';return}
  P.delete(e.pointerId);if(P.size<2)pinch=null;
  if(tap&&e.type==='pointerup'){
    if(tap.pin)openPin(tap.pin.dataset.pin);
    else if(tool==='pin'&&me.role==='gm'){const w=wpos(e);sock.emit('gm:pin',{op:'add',pin:{x:w.x,y:w.y,title:'Novo marcador',desc:''}});setTool('')}
  }
  tap=null;pan=null;
};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
function openPin(id){condId=null;mapsOpen=false;const n=S.pins.find(p=>p.id===id),s=$('#sheetbg');if(!n)return;
  s.innerHTML=me.role==='gm'?`<input id="pt" value="${esc(n.title)}" maxlength="60"><label>Descrição</label><textarea id="pd" rows="4" maxlength="600">${esc(n.desc)}</textarea><div style="display:flex;gap:8px;margin-top:14px"><button id="ps" style="flex:1">Salvar</button><button id="pr" class="ghost">Remover</button><button id="px" class="ghost">Fechar</button></div>`
   :`<h2 style="font-size:22px">${esc(n.title)}</h2><p style="white-space:pre-wrap;line-height:1.6">${esc(n.desc)||'—'}</p><button id="px">Fechar</button>`;
  s.classList.add('open');$('#px').onclick=()=>s.classList.remove('open');
  if(me.role==='gm'){$('#ps').onclick=()=>{sock.emit('gm:pin',{op:'edit',pin:{id,title:$('#pt').value,desc:$('#pd').value}});s.classList.remove('open')};$('#pr').onclick=()=>{sock.emit('gm:pin',{op:'del',pin:{id}});s.classList.remove('open')}}}
/* ---------- mapas múltiplos (Mestre) ---------- */
let mapsOpen=false,lastMap=null;
function loadImg(f,cb){
  if(!f)return cb(null,0,0);
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85),c.width,c.height)};im.src=r.result};
  r.readAsDataURL(f);
}
function openMaps(){
  const sb=$('#sheetbg'),m=S.map,maps=S.maps||[];
  mapsOpen=true;
  sb.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px">Mapas</h2><button class="ghost" id="mx">Fechar</button></div>
  <div style="margin-top:12px">${maps.map(x=>`<div class="rl"><span>${esc(x.name)}${x.id===m.id?' <b class="red" style="font-weight:400">● ativo</b>':''}</span><span>${x.id===m.id?'':`<button data-msw="${x.id}">Ativar</button> <button class="ghost" data-mdel="${x.id}">×</button>`}</span></div>`).join('')}</div>
  <div class="rnd"><div class="sm">Novo mapa</div><label>Nome<input id="mN" maxlength="40"></label><label>Imagem (PNG/JPG)<input type="file" id="mf" accept="image/png,image/jpeg"></label><label>Célula (px)<input type="number" id="mc" min="20" max="300" value="70"></label><button class="full" id="mAdd" style="width:100%;margin-top:12px">Criar mapa</button></div>
  <div class="rnd"><div class="sm">Mapa ativo: ${esc(m.name||'')}</div><label>Célula (px)<input type="number" id="mcA" min="20" max="300" value="${m.cell}"></label><label>Trocar imagem<input type="file" id="mfA" accept="image/png,image/jpeg"></label><button class="full" id="ms" style="width:100%;margin-top:12px">Aplicar</button></div>`;
  sb.onclick=ev=>{const t=ev.target;
    if(t.id==='mx'){mapsOpen=false;sb.classList.remove('open');return}
    if(t.dataset.msw!==undefined){sock.emit('gm:map:switch',{id:t.dataset.msw});return}
    if(t.dataset.mdel!==undefined){if(confirm('Excluir este mapa?'))sock.emit('gm:map:del',{id:t.dataset.mdel});return}
    if(t.id==='mAdd'){const name=sb.querySelector('#mN').value.trim()||'Novo mapa',cell=+sb.querySelector('#mc').value||70;
      loadImg(sb.querySelector('#mf').files[0],(img,w,h)=>sock.emit('gm:map:add',{name,img:img||'',w:w||1200,h:h||800,cell}));return}
    if(t.id==='ms'){const cell=+sb.querySelector('#mcA').value||m.cell;
      loadImg(sb.querySelector('#mfA').files[0],(img,w,h)=>{const body={w:m.w,h:m.h,cell};if(img){body.img=img;body.w=w;body.h=h}sock.emit('gm:map',body);setTimeout(fit,200)});return}
  };
  sb.classList.add('open');
}
$('#ts').onclick=()=>{condId=null;openMaps()};
</script>
</script>
